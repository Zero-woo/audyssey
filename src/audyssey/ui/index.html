<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audyssey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #172331;
  --muted: #5C6B7A;
  --line: #C9D2DB;
  --faint: #E2E7EC;
  --video: #2F6FED;
  --audio: #D98A00;
  --text: #108A73;
  --bad: #C2362F;
  --warn: #B7791F;
  --radius: 6px;
  font-family: "Instrument Sans", "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--video); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin-right: 8px; }
.top select { height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 220px; }
.btn { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.state { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.dot.run { background: var(--video); animation: pulse 1.2s ease-in-out infinite; }
.dot.ok { background: var(--text); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.error { color: var(--bad); padding: 8px 20px; margin: 0; background: #FBEDEC; border-bottom: 1px solid #F0C9C6; }

/* Layout */
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto 1fr; gap: 16px; padding: 16px 20px 24px; align-items: start; }
.board, .inspector, .studio { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.board { grid-column: 1; padding: 14px 8px 8px 0; overflow-x: auto; }
.inspector { grid-column: 2; grid-row: 1 / span 2; padding: 16px; overflow-y: auto; max-height: calc(100vh - 92px); position: sticky; top: 16px; align-self: start; }
.studio { grid-column: 1; display: grid; grid-template-columns: minmax(280px, 44%) 1fr; gap: 20px; padding: 16px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }

/* Routing board */
.legend { display: flex; gap: 16px; padding: 0 0 8px 16px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
svg.routing { display: block; min-width: 880px; width: 100%; height: auto; }
.lane-bg { fill: var(--bg); }
.lane-name { font-size: 13px; font-weight: 600; fill: var(--ink); }
.lane-model { font-size: 12px; fill: var(--muted); }
.edge { fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: .28; }
.edge.done { opacity: .9; }
.edge.active { opacity: 1; stroke-dasharray: 7 7; animation: flow .7s linear infinite; }
.edge.video { stroke: var(--video); } .edge.audio { stroke: var(--audio); } .edge.text { stroke: var(--text); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.node text { font-size: 14px; font-weight: 600; fill: var(--ink); pointer-events: none; }
.node .sub { font-size: 11.5px; font-weight: 500; fill: var(--muted); }
.node.done rect { stroke: var(--ink); }
.node.running rect { stroke: var(--video); stroke-width: 2.5; }
.node.warning rect { stroke: var(--warn); stroke-width: 2; }
.node.failed rect { stroke: var(--bad); stroke-width: 2.5; }
.node.selected rect { fill: var(--ink); }
.node.selected text { fill: #fff; }
.node.selected .sub { fill: #C9D2DB; }
.node:focus-visible rect { stroke: var(--video); stroke-width: 3; }
.node:hover rect { stroke: var(--ink); }
.status-dot.ok { fill: var(--text); } .status-dot.bad { fill: var(--bad); } .status-dot.none { fill: var(--line); }

/* Inspector */
.ins-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.ins-head h2 { margin: 0; font-size: 18px; }
.ins-where { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.call { border-top: 1px solid var(--faint); padding: 12px 0; }
.call > summary { cursor: pointer; display: flex; gap: 8px; align-items: center; font-weight: 600; list-style: none; }
.call > summary::-webkit-details-marker { display: none; }
.call > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.call[open] > summary::before { transform: rotate(45deg); }
.call .meta { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; }
.part { margin: 12px 0 0; }
.part h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
.part.in h3 { color: var(--video); } .part.out h3 { color: var(--text); }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
.frames figure { margin: 0; }
.frames img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; display: block; background: var(--faint); }
.frames figcaption { font-size: 11.5px; color: var(--muted); }
.clip { margin: 0 0 8px; }
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.clip video { width: 100%; border-radius: 4px; background: #000; display: block; }
.clip figcaption, .label { font-size: 12px; color: var(--muted); }
audio { width: 100%; height: 34px; display: block; }
pre { margin: 0; padding: 10px; background: var(--bg); border-radius: 4px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.plans { display: grid; gap: 6px; }
.plan { border-left: 3px solid var(--text); padding: 4px 0 4px 10px; font-size: 13px; }
.plan b { font-weight: 600; } .plan .k { color: var(--muted); margin-left: 6px; }
.plan .spans { color: var(--muted); font-size: 12px; }
.verdict { font-weight: 600; } .verdict.no { color: var(--bad); } .verdict.yes { color: var(--text); }
.err { color: var(--bad); font-size: 13px; margin: 8px 0 0; }
.empty { color: var(--muted); margin: 0; }

/* Studio */
.player video { width: 100%; border-radius: 6px; background: #000; display: block; }
.player .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.player .note { color: var(--muted); font-size: 13px; margin-left: auto; }
.tracks { display: grid; gap: 2px; align-content: start; }
.track { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--faint); }
.track .controls { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.track.off .name { color: var(--muted); text-decoration: line-through; }
.track .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track .sub { color: var(--muted); font-size: 12px; }
.icon { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon:hover:not(:disabled) { border-color: var(--ink); }
.icon:disabled { opacity: .35; cursor: default; }
.icon svg { width: 12px; height: 12px; fill: var(--ink); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); height: 30px; }
.stepper button { width: 28px; height: 28px; border: 0; background: none; font-size: 16px; line-height: 1; }
.stepper button:hover:not(:disabled) { background: var(--bg); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 58px; text-align: center; font-size: 13px; }
.stepper .unit { color: var(--muted); }
.track .tools { display: flex; gap: 6px; margin-left: auto; }
.small { height: 30px; padding: 0 10px; font-size: 13px; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 32px; text-align: center; color: var(--muted); }

@media (max-width: 1180px) {
  main { grid-template-columns: 1fr; }
  .inspector { grid-column: 1; grid-row: auto; position: static; max-height: none; }
  .studio { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .edge.active, .dot.run { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Audyssey</span>
  <select id="jobs" aria-label="작업 선택"><option value="">작업 선택</option></select>
  <label class="btn" style="display:inline-flex;align-items:center">영상 올리기<input id="file" type="file" accept="video/*" hidden></label>
  <span class="state" id="state" role="status"><span class="dot"></span><span>작업 없음</span></span>
</header>
<p class="error" id="error" role="alert" hidden></p>
<main>
  <section class="board" aria-label="처리 흐름과 서버">
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--video)"></i>영상</span>
      <span><i style="background:var(--audio)"></i>오디오</span>
      <span><i style="background:var(--text)"></i>텍스트</span>
    </div>
    <svg class="routing" id="board" role="group" aria-label="단계 다이어그램"></svg>
  </section>
  <aside class="inspector" id="inspector" aria-live="polite"></aside>
  <section class="studio" aria-label="결과">
    <div class="player">
      <video id="video" controls playsinline preload="metadata"></video>
      <div class="row">
        <button class="btn primary" id="render" disabled>합치기</button>
        <a class="btn" id="export" style="display:inline-flex;align-items:center;text-decoration:none" aria-disabled="true">내보내기</a>
        <span class="note" id="note"></span>
      </div>
    </div>
    <div>
      <h2>소스</h2>
      <div class="tracks" id="tracks"><p class="empty">분석이 끝나면 여기에 나옵니다.</p></div>
    </div>
  </section>
</main>
<audio id="solo" preload="none"></audio>
<script>
const $ = (id) => document.getElementById(id);
const S = { job: null, lanes: [], trace: [], selected: "plan", events: null, busy: false, playing: null, rendered: null };

const STEPS = {
  preprocess: { label: "전처리", col: 0 },
  plan: { label: "계획", col: 1 },
  validate_plan: { label: "검수", col: 2 },
  ground: { label: "위치 찾기", col: 3 },
  separate: { label: "분리", col: 4 },
  generate: { label: "생성", col: 4 },
  judge: { label: "판정", col: 5 },
  score: { label: "채점", col: 5 },
  residual: { label: "잔여음", col: 6 },
  render: { label: "합치기", col: 7 },
};
const EDGES = [
  ["preprocess", "plan", "video"],
  ["plan", "validate_plan", "text"],
  ["validate_plan", "plan", "text", "loop"],
  ["validate_plan", "ground", "text"],
  ["ground", "separate", "video"],
  ["validate_plan", "separate", "text"],
  ["preprocess", "separate", "audio"],
  ["separate", "judge", "audio"],
  ["judge", "separate", "text", "loop"],
  ["validate_plan", "generate", "text"],
  ["generate", "score", "audio"],
  ["score", "generate", "text", "loop"],
  ["judge", "residual", "audio"],
  ["residual", "render", "audio"],
  ["score", "render", "audio"],
];
const KIND = { dialogue: "대사", sfx: "효과음", music: "음악", ambience: "환경음" };
const STATUS = { pending: "대기", running: "진행 중", done: "완료", failed: "실패", skipped: "건너뜀", warning: "확인 필요" };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c.nodeType ? c : String(c));
  return node;
}
const fileUrl = (path) => `/api/jobs/${S.job.id}/files/${path.split("/").map(encodeURIComponent).join("/")}`;
const sec = (n) => `${Number(n).toFixed(n >= 10 ? 1 : 2).replace(/\.?0+$/, "")}초`;

async function call(path, options = {}) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return response.json();
}
function showError(error) {
  $("error").textContent = error ? (error.message || String(error)) : "";
  $("error").hidden = !error;
}

/* ---------- step status ---------- */
function stepKey(key) { return key.split(":")[0]; }
function nodeState(step) {
  const steps = (S.job?.steps || []).filter((s) => stepKey(s.key) === step);
  if (!steps.length) return { status: "pending", steps };
  const order = ["failed", "running", "warning", "done"];
  const status = order.find((o) => steps.some((s) => s.status === o)) || "pending";
  return { status, steps };
}
function nodeSub(step, info) {
  const job = S.job;
  if (!job) return "";
  if (step === "plan" || step === "validate_plan") {
    const s = info.steps[0];
    return s && s.max_rounds ? `${s.round}/${s.max_rounds}회` : "";
  }
  if (["separate", "judge", "generate", "score"].includes(step)) {
    if (!info.steps.length) return "";
    const done = info.steps.filter((s) => s.status !== "running").length;
    return `${done}/${info.steps.length}개`;
  }
  return info.status === "pending" ? "" : STATUS[info.status];
}

/* ---------- routing board ---------- */
function drawBoard() {
  const svg = $("board");
  const lanes = S.lanes.length ? S.lanes : [{ id: "app", name: "App server", models: [], steps: Object.keys(STEPS), up: null }];
  const usesGeneration = S.job ? (S.job.silent || S.job.sources.some((s) => s.origin === "generated")) : true;
  const visible = new Set(lanes.flatMap((l) => l.steps).filter((s) => {
    if (s === "generate" || s === "score") return usesGeneration;
    if (s === "separate" || s === "judge" || s === "residual") return !S.job || !S.job.silent;
    return true;
  }));
  const rowH = 62, pad = 10, top = 6, left = 196, colW = 106, nodeW = 94, nodeH = 44;
  // A lane gets a second row when two of its steps share a column (e.g. separate
  // and generate both on the app server in stub mode).
  const pos = {}, laneY = [];
  let y = top;
  lanes.forEach((lane) => {
    const used = {};
    let rows = 1;
    for (const s of lane.steps) {
      if (!visible.has(s)) continue;
      const row = used[STEPS[s].col] = (used[STEPS[s].col] ?? -1) + 1;
      rows = Math.max(rows, row + 1);
      pos[s] = { x: left + STEPS[s].col * colW + 10, y: y + pad + row * rowH };
    }
    const h = rows * rowH + pad * 2 - (rowH - nodeH);
    laneY.push([y, h]);
    y += h + 6;
  });
  const width = left + 8 * colW + 10, height = y;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs, text) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    return n;
  };
  svg.replaceChildren();
  lanes.forEach((lane, i) => {
    const [ly, lh] = laneY[i], mid = ly + pad + nodeH / 2;
    svg.append(make("rect", { class: "lane-bg", x: 8, y: ly, width: width - 16, height: lh, rx: 6 }));
    const up = lane.up === true ? "ok" : lane.up === false ? "bad" : "none";
    svg.append(make("circle", { class: `status-dot ${up}`, cx: 24, cy: mid - 7, r: 4.5 }));
    svg.append(make("text", { class: "lane-name", x: 36, y: mid - 2 }, laneName(lane.name)));
    svg.append(make("text", { class: "lane-model", x: 36, y: mid + 15 }, shorten(lane.models.map((m) => m.split("/").pop()).join(", "), 26)));
  });
  const states = Object.fromEntries(Object.keys(STEPS).map((s) => [s, nodeState(s)]));
  for (const [from, to, kind, loop] of EDGES) {
    const a = pos[from], b = pos[to];
    if (!a || !b) continue;
    const st = states[to].status, sf = states[from].status;
    let cls = "edge " + kind;
    if (loop) {
      const looped = (states[to].steps.some((s) => s.round > 1)) || (to === "plan" && (S.job?.plan_issues || []).length);
      if (!looped) continue;
      if (st === "running") cls += " active"; else cls += " done";
    } else if (st === "running" && sf !== "pending") cls += " active";
    else if (sf !== "pending" && st !== "pending") cls += " done";
    let d;
    const ax = a.x + nodeW, ay = a.y + nodeH / 2, bx = b.x, by = b.y + nodeH / 2;
    if (loop) {
      const lift = Math.min(a.y, b.y) - 2;
      d = `M ${a.x + nodeW / 2} ${a.y} C ${a.x + nodeW / 2} ${lift - 22}, ${b.x + nodeW / 2} ${lift - 22}, ${b.x + nodeW / 2} ${b.y}`;
    } else if (bx > ax) {
      const mid = (ax + bx) / 2;
      d = `M ${ax} ${ay} C ${mid} ${ay}, ${mid} ${by}, ${bx} ${by}`;
    } else {
      d = `M ${a.x + nodeW / 2} ${a.y + nodeH} C ${a.x + nodeW / 2} ${by}, ${bx - 30} ${by}, ${bx} ${by}`;
    }
    svg.append(make("path", { class: cls, d }));
  }
  for (const [step, p] of Object.entries(pos)) {
    const info = states[step];
    const g = make("g", { class: `node ${info.status}${S.selected === step ? " selected" : ""}`, tabindex: 0, role: "button", "data-step": step, "aria-label": `${STEPS[step].label} ${STATUS[info.status]}` });
    g.append(make("rect", { x: p.x, y: p.y, width: nodeW, height: nodeH, rx: 6 }));
    const sub = nodeSub(step, info);
    g.append(make("text", { x: p.x + 11, y: p.y + (sub ? 19 : 27) }, STEPS[step].label));
    if (sub) g.append(make("text", { class: "sub", x: p.x + 11, y: p.y + 35 }, sub));
    svg.append(g);
  }
}
function laneName(name) {
  return name.replace("App server", "앱 서버").replace("Tool server", "도구 서버");
}
function shorten(text, n) { return text.length > n ? text.slice(0, n - 1) + "…" : text; }
$("board").addEventListener("click", (e) => {
  const g = e.target.closest(".node");
  if (g) select(g.dataset.step);
});
$("board").addEventListener("keydown", (e) => {
  const g = e.target.closest(".node");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.step); }
});
function select(step) { S.selected = step; drawBoard(); drawInspector(); }

/* ---------- inspector ---------- */
const TOOL_STEP = { plan: "plan", validate_plan: "validate_plan", separate: "separate", judge: "judge", locate: "ground", mask_video: "ground", generate: "generate", score_generation: "score", preprocess: "preprocess", residual: "residual", render: "render" };

function drawInspector() {
  const box = $("inspector");
  const step = S.selected;
  const lane = S.lanes.find((l) => l.steps.includes(step));
  const calls = S.trace.filter((c) => TOOL_STEP[c.tool] === step).reverse();
  box.replaceChildren(
    el("div", { class: "ins-head" }, el("h2", {}, STEPS[step].label)),
    el("p", { class: "ins-where" }, lane ? [laneName(lane.name), lane.models.length ? `, ${lane.models.join(", ")}` : ""].join("") : ""),
  );
  if (!S.job) { box.append(el("p", { class: "empty" }, "영상을 올리면 단계별 입력과 출력이 여기에 나옵니다.")); return; }
  if (!calls.length) { box.append(el("p", { class: "empty" }, nodeState(step).status === "running" ? "진행 중입니다." : "아직 실행되지 않았습니다.")); return; }
  calls.forEach((c, i) => box.append(renderCall(c, i === 0)));
}

function callTitle(c) {
  const src = c.step.includes(":") ? sourceName(c.step.split(":")[1]) : "";
  const plan = c.inputs?.plan?.name;
  return src || plan || STEPS[TOOL_STEP[c.tool]]?.label || c.tool;
}
function sourceName(id) { return S.job?.sources.find((s) => s.id === id)?.plan.name || id; }

function renderCall(c, open) {
  const details = el("details", { class: "call", open },
    el("summary", {}, callTitle(c), el("span", { class: "meta" }, sec(c.seconds))));
  if (c.error) details.append(el("p", { class: "err" }, c.error));
  if (c.requests?.length) {
    for (const r of c.requests) details.append(renderRequest(r));
  } else {
    // "out" is where the tool will write, not something it receives.
    const inputs = Object.fromEntries(Object.entries(c.inputs).filter(([k, v]) => k !== "out" && v !== null));
    details.append(el("div", { class: "part in" }, el("h3", {}, "입력"), renderValue(inputs)));
  }
  if (c.output !== null && c.output !== undefined) {
    details.append(el("div", { class: "part out" }, el("h3", {}, "출력"), renderOutput(c)));
  }
  return details;
}

function renderRequest(r) {
  const frames = r.media.filter((m) => m.kind === "image");
  const clips = r.media.filter((m) => m.kind === "video");
  const how = r.input === "video" ? `영상 ${r.fps}fps${r.audio ? ", 오디오 포함" : ""}` : `프레임 ${r.fps}fps`;
  return el("div", {},
    el("div", { class: "part in" },
      el("h3", {}, `입력  ${r.model}, ${how}${r.attempt > 1 ? `, 재요청 ${r.attempt}` : ""}`),
      frames.length ? el("div", { class: "frames" }, frames.map((m) =>
        el("figure", {}, el("img", { src: fileUrl(m.file), alt: m.label, loading: "lazy" }), el("figcaption", {}, m.label.replace(/^Frame at (.+) seconds$/, "$1초"))))) : null,
      el("div", { class: "clips" }, clips.map((m) => el("figure", { class: "clip" },
        el("video", { src: fileUrl(m.file), controls: true, preload: "metadata", playsinline: true }),
        el("figcaption", {}, m.label.replace(/^Video from (.+) to (.+) seconds$/, "$1–$2초"))))),
      el("p", { class: "label" }, "텍스트"),
      el("pre", {}, r.text),
      el("details", {}, el("summary", { class: "label" }, "프롬프트"), el("pre", {}, r.system)),
    ),
    el("div", { class: "part out" },
      el("h3", {}, `응답${r.usage?.total_tokens ? `  ${r.usage.input_tokens}+${r.usage.output_tokens} 토큰` : ""}`),
      el("pre", {}, pretty(r.raw))),
  );
}
function pretty(raw) {
  if (raw == null) return "(빈 응답)";
  try { return JSON.stringify(JSON.parse(raw), null, 2); } catch { return raw; }
}

function renderOutput(c) {
  const o = c.output;
  if (c.tool === "plan" && Array.isArray(o)) return renderPlans(o);
  if (c.tool === "validate_plan" && Array.isArray(o)) {
    return o.length ? el("div", { class: "plans" }, o.map((i) => el("div", { class: "plan", style: "border-color:var(--bad)" }, el("b", {}, i.source_name || "전체"), " ", i.message)))
      : el("p", { class: "verdict yes" }, "문제 없음");
  }
  if ((c.tool === "judge" || c.tool === "score_generation") && o && typeof o === "object") {
    return el("div", {},
      el("p", { class: `verdict ${o.passed ? "yes" : "no"}` }, o.passed ? "통과" : "다시 시도"),
      el("dl", { class: "kv" }, Object.entries(o.scores || {}).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, Number(v).toFixed(3))])),
      o.reason ? el("p", { class: "label" }, o.reason) : null);
  }
  return renderValue(o);
}
function renderPlans(plans) {
  return el("div", { class: "plans" }, plans.map((p) => el("div", { class: "plan" },
    el("b", {}, p.name), el("span", { class: "k" }, KIND[p.kind] || p.kind),
    el("div", {}, p.description),
    p.spans?.length ? el("div", { class: "spans" }, p.spans.map((s) => `${sec(s.start)}–${sec(s.end)}`).join(", ")) : null)));
}

function renderValue(v) {
  if (v && typeof v === "object" && !Array.isArray(v) && typeof v.file === "string") return renderFile(v.file);
  if (Array.isArray(v)) {
    if (v.length && v.every((x) => x && typeof x === "object" && "description" in x && "kind" in x)) return renderPlans(v);
    if (!v.length) return el("span", { class: "label" }, "없음");
    return el("div", { class: "plans" }, v.map(renderValue));
  }
  if (v && typeof v === "object") {
    if ("description" in v && "kind" in v && "name" in v) return renderPlans([v]);
    return el("dl", { class: "kv" }, Object.entries(v).flatMap(([k, x]) => [el("dt", {}, k), el("dd", {}, renderValue(x))]));
  }
  if (typeof v === "number") return String(Math.round(v * 1000) / 1000);
  return String(v ?? "");
}
function renderFile(path) {
  const ext = path.split(".").pop().toLowerCase();
  const name = path.split("/").pop();
  if (["jpg", "jpeg", "png"].includes(ext)) return el("img", { src: fileUrl(path), alt: name, style: "max-width:100%;border-radius:4px" });
  if (["mp4", "mov", "webm", "mkv"].includes(ext)) return el("figure", { class: "clip" }, el("video", { src: fileUrl(path), controls: true, preload: "metadata", playsinline: true }), el("figcaption", {}, name));
  if (["wav", "mp3", "flac"].includes(ext)) return el("div", {}, el("span", { class: "label" }, name), el("audio", { src: fileUrl(path), controls: true, preload: "none" }));
  return el("a", { href: fileUrl(path) }, name);
}

/* ---------- studio ---------- */
function drawStudio() {
  const job = S.job;
  const video = $("video");
  if (!job) { video.removeAttribute("src"); return; }
  const src = job.outputs ? `${fileUrl(job.outputs.video_mp4)}?v=${S.rendered}` : fileUrl(job.video_path);
  if (video.dataset.src !== src) {
    const t = video.currentTime, playing = !video.paused;
    video.dataset.src = src;
    video.src = src;
    video.addEventListener("loadedmetadata", () => { video.currentTime = Math.min(t, video.duration || t); if (playing) video.play(); }, { once: true });
  }
  const ready = job.state === "ready";
  $("render").disabled = !ready || S.busy;
  const exportLink = $("export");
  if (job.outputs && !S.busy) { exportLink.href = `/api/jobs/${job.id}/export`; exportLink.removeAttribute("aria-disabled"); exportLink.style.opacity = ""; }
  else { exportLink.removeAttribute("href"); exportLink.setAttribute("aria-disabled", "true"); exportLink.style.opacity = ".45"; }
  $("note").textContent = S.busy ? "적용 중" : job.outputs ? "합친 결과" : "원본";
  drawTracks();
}

function drawTracks() {
  const job = S.job, box = $("tracks");
  if (!job.sources.length && !job.residual.path) { box.replaceChildren(el("p", { class: "empty" }, job.state === "running" ? "분석 중입니다." : "소스가 없습니다.")); return; }
  const ready = job.state === "ready" && !S.busy;
  const rows = job.sources.map((s) => trackRow({
    id: s.id, name: s.plan.name, keep: s.keep, gain: s.gain, pitch: s.pitch_semitones, path: s.track_path,
    sub: `${KIND[s.plan.kind] || s.plan.kind}, ${s.origin === "generated" ? "생성" : "분리"}, ${STATUS[s.status]}${s.filter ? (s.filter.passed ? ", 통과" : ", 미통과") : ""}`,
    redo: s.status !== "skipped", generated: s.origin === "generated", ready,
  }));
  if (job.residual.path) rows.push(trackRow({ id: "residual", name: "나머지 소리", keep: job.residual.keep, gain: job.residual.gain, pitch: null, path: job.residual.path, sub: "소스로 나뉘지 않은 소리", redo: false, ready }));
  box.replaceChildren(...rows);
}

const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';
const STOP = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h8v8H2z"/></svg>';
function trackRow(t) {
  const play = el("button", { class: "icon", "aria-label": `${t.name} 듣기`, disabled: !t.path, onclick: () => solo(t) });
  play.innerHTML = S.playing === t.id ? STOP : PLAY;
  const stepper = (label, value, text, onDown, onUp, min, max) => el("span", { class: "stepper", role: "group", "aria-label": label },
    el("button", { "aria-label": `${label} 낮추기`, disabled: !t.ready || value <= min, onclick: onDown }, "−"),
    el("output", {}, text),
    el("button", { "aria-label": `${label} 높이기`, disabled: !t.ready || value >= max, onclick: onUp }, "+"));
  return el("div", { class: `track${t.keep ? "" : " off"}` },
    play,
    el("div", {}, el("div", { class: "name", title: t.name }, t.name), el("div", { class: "sub" }, t.sub)),
    el("div", { class: "controls" },
    stepper("음량", t.gain, `${Math.round(t.gain * 100)}%`,
      () => edit({ type: "set_gain", source_id: t.id, gain: round(Math.max(0, t.gain - 0.1)) }),
      () => edit({ type: "set_gain", source_id: t.id, gain: round(Math.min(2, t.gain + 0.1)) }), 0, 2),
    t.pitch === null ? el("span") : stepper("피치", t.pitch, `${t.pitch > 0 ? "+" : ""}${t.pitch} 반음`,
      () => edit({ type: "set_pitch", source_id: t.id, semitones: t.pitch - 1 }),
      () => edit({ type: "set_pitch", source_id: t.id, semitones: t.pitch + 1 }), -12, 12),
    el("span", { class: "tools" },
      el("button", { class: "btn small", disabled: !t.ready, "aria-pressed": String(t.keep), onclick: () => edit({ type: t.keep ? "drop" : "keep", source_id: t.id }) }, t.keep ? "끄기" : "켜기"),
      t.redo ? el("button", { class: "btn small", disabled: !t.ready, onclick: () => edit({ type: t.generated ? "generate" : "reseparate", source_id: t.id }) }, "다시 만들기") : null)));
}
const round = (x) => Math.round(x * 100) / 100;

function solo(t) {
  const audio = $("solo");
  if (S.playing === t.id) { audio.pause(); S.playing = null; drawTracks(); return; }
  $("video").pause();
  audio.src = fileUrl(t.path) + `?v=${S.job.version}`;
  audio.volume = Math.min(1, t.gain);
  audio.play();
  S.playing = t.id;
  audio.onended = () => { S.playing = null; drawTracks(); };
  drawTracks();
}
$("video").addEventListener("play", () => { if (S.playing) { $("solo").pause(); S.playing = null; drawTracks(); } });

async function edit(command) {
  if (S.busy) return;
  S.busy = true; drawStudio(); showError(null);
  try {
    S.job = await call(`/api/jobs/${S.job.id}/commands`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(command) });
    await renderJob();
  } catch (e) { showError(e); }
  finally { S.busy = false; drawAll(); }
}
async function renderJob() {
  S.job = await call(`/api/jobs/${S.job.id}/commands`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: "render" }) });
  S.rendered = S.job.version;
}
$("render").addEventListener("click", async () => {
  S.busy = true; drawStudio(); showError(null);
  try { await renderJob(); } catch (e) { showError(e); }
  finally { S.busy = false; drawAll(); }
});
$("export").addEventListener("click", (e) => { if (!$("export").href) e.preventDefault(); });

/* ---------- jobs ---------- */
function drawState() {
  const job = S.job, box = $("state");
  let cls = "", text = "작업 없음";
  if (job) {
    const running = job.steps.filter((s) => s.status === "running").map((s) => STEPS[stepKey(s.key)]?.label).filter(Boolean);
    if (job.state === "running") { cls = "run"; text = running.length ? `${running[running.length - 1]} 중` : "시작 중"; }
    else if (job.state === "failed") { cls = "bad"; text = "실패"; }
    else { cls = "ok"; text = "완료"; }
  }
  box.replaceChildren(el("span", { class: `dot ${cls}` }), el("span", {}, text));
  if (job?.state === "failed" && job.error) showError(job.error);
}
function drawAll() { drawState(); drawBoard(); drawInspector(); drawStudio(); }

let traceTimer;
function refreshTrace() {
  clearTimeout(traceTimer);
  traceTimer = setTimeout(async () => {
    if (!S.job) return;
    try { S.trace = await call(`/api/jobs/${S.job.id}/trace`); drawInspector(); } catch {}
  }, 150);
}

function follow(job) {
  S.events?.close();
  S.job = job; S.trace = []; S.playing = null; S.rendered = job.version;
  if (job.state === "running") S.selected = "plan";
  $("jobs").value = job.id;
  drawAll(); refreshTrace();
  S.events = new EventSource(`/api/jobs/${job.id}/events`);
  S.events.onmessage = (e) => {
    const next = JSON.parse(e.data);
    if (next.id !== S.job?.id) return;
    S.job = next;
    if (next.outputs && !S.rendered) S.rendered = next.version;
    drawState(); drawBoard(); refreshTrace(); if (!S.busy) drawStudio();
  };
}

async function loadJobs(select) {
  const jobs = await call("/api/jobs");
  const box = $("jobs");
  box.replaceChildren(el("option", { value: "" }, "작업 선택"), ...jobs.map((j) =>
    el("option", { value: j.id }, `${j.id}  ${j.state === "ready" ? "완료" : j.state === "failed" ? "실패" : "진행 중"}, ${j.sources.length}개 소스`)));
  if (select) box.value = select;
}
$("jobs").addEventListener("change", async (e) => {
  if (!e.target.value) return;
  try { follow(await call(`/api/jobs/${e.target.value}`)); } catch (err) { showError(err); }
});
$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showError(null);
  const form = new FormData();
  form.append("file", file);
  try {
    const job = await call("/api/jobs", { method: "POST", body: form });
    await loadJobs(job.id);
    follow(job);
  } catch (err) { showError(err); }
  e.target.value = "";
});

async function loadSystem() {
  try { S.lanes = await call("/api/system"); } catch (e) { showError(e); }
  drawBoard();
}

(async () => {
  drawAll();
  await loadSystem();
  try { await loadJobs(); } catch (e) { showError(e); }
  const first = $("jobs").options[1]?.value;
  if (first) { $("jobs").value = first; $("jobs").dispatchEvent(new Event("change")); }
  setInterval(loadSystem, 15000);
})();
</script>
</body>
</html>
